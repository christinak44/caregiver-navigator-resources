name: Refresh resources

on:
  schedule:
    - cron: '17 13 * * 1' # weekly, Mondays 13:17 UTC
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/build-resources.mjs
      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain resources.json)" ]]; then
            git config user.name "resources-bot"
            git config user.email "actions@users.noreply.github.com"
            git add resources.json
            git commit -m "chore: refresh resources.json (auto)"
            git push
          else
            echo "No changes to commit."
          fi
